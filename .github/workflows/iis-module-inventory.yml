name: Inert IIS module setup inventory
on:
  push:
    branches: [h5-ancm-iis-inventory]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Inspect runner and installed components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner: $env:ImageOS $env:ImageVersion"
          dotnet --list-sdks
          $url = 'https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/11.0.0/dotnet-hosting-11.0.0-win.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-hosting-11.0.0-win.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          Write-Host "Hosting bundle signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Hosting bundle signature did not validate as Microsoft'
          }
          Write-Host "Hosting bundle SHA256: $((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash)"
          $install = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          Write-Host "Hosting bundle installer exit code: $($install.ExitCode)"
          if ($install.ExitCode -ne 0 -and $install.ExitCode -ne 3010) {
            throw "Hosting bundle installation failed: $($install.ExitCode)"
          }
          Write-Host "IIS feature:"
          Get-WindowsOptionalFeature -Online -FeatureName IIS-WebServerRole | Select-Object FeatureName,State | Format-List
          $roots = @(
            'C:\Program Files\IIS\Asp.Net Core Module\V2',
            'C:\Program Files (x86)\IIS\Asp.Net Core Module\V2',
            'C:\Windows\System32\inetsrv'
          )
          foreach ($root in $roots) {
            Write-Host "Path $root exists: $(Test-Path $root)"
            if (Test-Path $root) {
              Get-ChildItem -LiteralPath $root -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '^(aspnetcorev2|appcmd|w3wp)(\.dll|\.exe)$' } |
                ForEach-Object {
                  Write-Host "File $($_.FullName) version $($_.VersionInfo.FileVersion) SHA256 $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
                }
            }
          }
