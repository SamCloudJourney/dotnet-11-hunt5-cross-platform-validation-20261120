name: Inert Windows API buffer lifecycle
on:
  push:
    branches: [h5-winhttp-api-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and run local loopback check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          $winhttp = Join-Path $env:windir 'System32\winhttp.dll'
          Get-Item $winhttp | Select-Object FullName, Length, @{Name='Version';Expression={$_.VersionInfo.FileVersion}}
          Get-FileHash $winhttp -Algorithm SHA256
          $vcvars = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw 'MSVC environment missing' }
          cmd /c "`"$vcvars`" && cl /nologo /EHsc /W4 /O2 probe.cpp /link winhttp.lib"
          if ($LASTEXITCODE -ne 0) { throw 'native build failed' }
          $server = Start-Process -FilePath 'python' -ArgumentList '-u','server.py' -PassThru -RedirectStandardOutput 'server.log' -RedirectStandardError 'server.err'
          try {
            Start-Sleep -Seconds 2
            .\probe.exe
            if ($LASTEXITCODE -ne 0) { throw "probe failed: $LASTEXITCODE" }
            Wait-Process -Id $server.Id -Timeout 15
            Get-Content 'server.log'
            if (Test-Path 'server.err') { Get-Content 'server.err' }
          }
          finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
